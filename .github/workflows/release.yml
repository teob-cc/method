# A tag such as 2026.10.30 (calendar version, no "v") publishes a GitHub release carrying the built site:
# method-dist-<tag>.tar.gz and SHA256SUMS. teob's website build fetches a release by tag and checks the digest.
name: Release
on:
  push:
    tags: ['[0-9][0-9][0-9][0-9].*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package dist
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar czf "method-dist-${TAG}.tar.gz" -C dist .
          sha256sum "method-dist-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --notes "The built site of teob.cc/method at $TAG. Stamps: see the pages." "method-dist-${TAG}.tar.gz" SHA256SUMS
