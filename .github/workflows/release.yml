# Publishes a GitHub release carrying the built site for an existing tag such as 2026.10.30 (calendar version, no
# "v"): method-dist-<tag>.tar.gz and SHA256SUMS. teob's website build fetches a release by tag and checks the digest.
# Manual only: a public release happens when someone dispatches this workflow with the tag, never from the tag push
# itself.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. 2026.10.30'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: [self-hosted, test-public]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "a release tag is a date such as 2026.10.30, got '$TAG'" >&2; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package dist
        run: |
          tar czf "method-dist-${TAG}.tar.gz" -C dist .
          sha256sum "method-dist-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "The built site of teob.cc/method at $TAG. Stamps: see the pages." "method-dist-${TAG}.tar.gz" SHA256SUMS
