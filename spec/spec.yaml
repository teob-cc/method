stamp: "METHOD PAPER · V4.13 (NAMES AND THEIR CONTRACTS) · 2026-10 · TALK · ARTICLE · DESIGN-DOC TEMPLATE · INTERVIEW SCRIPT"
subtitle: "**Four primitives. Ten steps. One discipline.** A design method in which every internal choice is derived from an external constraint — and can be deleted the moment it can't name one."
notes:
  - "**Update · V4.13.** Names now carry their scope from client language through data, APIs, components and change history. The naming discipline adapts [ANSI/NISO Z39.19-2005 (R2010)](#naming); it does not turn a descriptive name into evidence that a guarantee holds."
  - "**Update · V4.12.** A mechanism in a trace row is a claim of coverage, not proof. This revision separates authority from consistency, reservations from observations, and operation state from what a caller knows; it states the conditions behind delivery, erasure and numerical bounds. The examples and companion skills carry the same corrections."
