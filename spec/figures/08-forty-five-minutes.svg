<g font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
<text fill="#101820" x="140" y="98">PASS 1 · STEPS 01–04</text>
<text fill="#FBFCFB" x="576" y="98">PASS 2 · SELECTIVE DEPTH · 05–09</text>
<text fill="#FBFCFB" x="935" y="98">CLOSE · 10</text>
</g>
<g fill="#4A5560" font-size="10.5" text-anchor="middle">
<text x="140" y="134">shallow and timeboxed — annotated graph exists</text>
<text x="576" y="134">the audience steers; if they don't, go to failure</text>
<text x="935" y="134">the walk</text>
</g>
<g fill="#C21F2C" font-size="11" font-weight="600" text-anchor="middle">
<text x="140" y="60">0:00 – 12:00</text>
<text x="576" y="60">12:00 – 40:00</text>
<text x="935" y="60">40:00 – 45:00</text>
