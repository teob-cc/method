<circle cx="271" cy="72" fill="#C21F2C" r="5"></circle>
<text fill="#4A5560" font-size="10.5" text-anchor="middle" x="271" y="168">● checkpoint — “the graph is on the board; where would you like depth?”</text>
<text fill="#1B4F8A" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="700" x="10" y="30">THE MAP IS NOT THE ITINERARY</text>
<text fill="#4A5560" font-size="11" x="10" y="46">Depth is spent where the risk is, not where the comfort is. A deep dive into familiar territory while the graph is still empty reads as avoidance.</text>
</svg>
