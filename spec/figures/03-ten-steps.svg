<!-- feedback arcs -->
<path d="M452,176 C452,214 300,214 268,182" fill="none" marker-end="url(#arM)" stroke="#C21F2C" stroke-dasharray="6 4" stroke-width="2"></path>
<text fill="#C21F2C" font-size="10" font-weight="600" text-anchor="middle" x="360" y="228">residency &amp; erasure rules reshape data classes</text>
<path d="M644,176 C644,268 380,278 300,190" fill="none" marker-end="url(#arM)" stroke="#C21F2C" stroke-dasharray="6 4" stroke-width="2"></path>
<text fill="#C21F2C" font-size="10" font-weight="600" text-anchor="middle" x="520" y="288">a guarantee that doesn't survive a partition reopens the data model and the stores</text>
<text fill="#1B4F8A" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" font-weight="700" x="20" y="20">EACH STEP CONSUMES THE WRITTEN OUTPUT OF THE ONE BEFORE IT — IF A STEP PRODUCED NOTHING WRITTEN, IT DIDN'T HAPPEN</text>
<text fill="#4A5560" font-size="10" text-anchor="end" x="980" y="312">Phases I–II answer “what is this”. Phase III answers “what happens when it breaks”. Phase IV answers “is any of it justified”.</text>
