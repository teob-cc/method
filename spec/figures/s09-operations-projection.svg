<text fill="#C21F2C" font-weight="600" x="470" y="70">outcome KPIs — did they actually get what they came for</text>
<text x="470" y="94">SLOs, one per class × operation, with an error budget</text><text x="470" y="118">projection lag, alarmed at half the promised bound</text><text font-weight="600" x="470" y="142">which rung each class is served, and for how long</text><text font-weight="600" x="470" y="166">a continuous audit that does not trust the system</text>
<text x="470" y="190">the ownership map and its pager rotations</text><text x="470" y="214">spend attributed per class, checked against it</text><text x="470" y="238">release machinery sized to it — a spike needs a deploy</text>
