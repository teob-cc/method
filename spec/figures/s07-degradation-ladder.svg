<svg font-family="IBM Plex Mono, monospace" font-size="10" viewbox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arF" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0L10,5L0,10z" fill="#4A5560"></path></marker></defs>
<line marker-end="url(#arF)" stroke="#4A5560" stroke-width="1.5" x1="20" x2="960" y1="30" y2="30"></line>
<text fill="#4A5560" x="20" y="22">increasing severity for the caller</text>
<g stroke="#101820" stroke-width="2">
<rect fill="#DCE6F0" height="74" width="150" x="20" y="44"></rect>
<rect fill="#C4D5E8" height="74" width="150" x="180" y="44"></rect>
<rect fill="#A9C2DE" height="74" width="150" x="340" y="44"></rect>
<rect fill="#8FA9C6" height="74" width="150" x="500" y="44"></rect>
<rect fill="#3E6FA3" height="74" width="150" x="660" y="44"></rect>
<rect fill="#F7E6E7" height="74" width="150" x="820" y="44"></rect>
</g>
<g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
<text fill="#101820" x="95" y="66">CORRECT, SLOWER</text>
<text fill="#101820" x="255" y="66">CORRECT, LESS</text>
<text fill="#101820" x="415" y="66">STALE, COMPLETE</text>
<text fill="#101820" x="575" y="66">PENDING, SIGNALLED</text>
<text fill="#FBFCFB" x="735" y="66">ABSENT, SIGNALLED</text>
<text fill="#C21F2C" x="895" y="66">WRONG</text>
</g>
<g font-size="9.5" text-anchor="middle">
<text fill="#4A5560" x="95" y="86">retry or hedge succeeded</text>
<text fill="#4A5560" x="95" y="99">paid for out of the</text>
<text fill="#4A5560" x="95" y="111">latency budget</text>
<text fill="#4A5560" x="255" y="86">partial results</text>
<text fill="#4A5560" x="255" y="99">needs a partial flag</text>
<text fill="#4A5560" x="255" y="111">in the contract</text>
<text fill="#4A5560" x="415" y="86">last known good</text>
<text fill="#4A5560" x="415" y="99">needs a stated bound</text>
<text fill="#4A5560" x="415" y="111">and an as-of timestamp</text>
<text fill="#101820" x="575" y="86">accepted, result follows</text>
<text fill="#101820" x="575" y="99">callback, poll, or notify</text>
<text fill="#101820" x="575" y="111">needs a handle, a deadline</text>
<text fill="#DCE6F0" x="735" y="86">typed error, retry-after</text>
<text fill="#DCE6F0" x="735" y="99">the caller decides</text>
<text fill="#DCE6F0" x="735" y="111">what to do next</text>
<text fill="#C21F2C" font-weight="600" x="895" y="90">never a rung</text>
<text fill="#C21F2C" font-weight="600" x="895" y="105">on any ladder</text>
</g>
<line stroke="#C21F2C" stroke-width="2" x1="830" x2="955" y1="112" y2="50"></line>
<text fill="#1B4F8A" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" font-weight="700" x="20" y="150">THE ACCEPTABLE SET IS A CLIENT PROPERTY, NOT A SYSTEM PROPERTY</text>
<g fill="#101820" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11.5" font-weight="700">
<text x="20" y="185">Interactive</text>
<text x="20" y="225">Batch</text>
<text x="20" y="265">Money path</text>
</g>
<g stroke="#101820" stroke-width="1.5">
<rect fill="#2E6B4F" height="16" width="16" x="87" y="172"></rect><rect fill="#2E6B4F" height="16" width="16" x="247" y="172"></rect>
<rect fill="#2E6B4F" height="16" width="16" x="407" y="172"></rect><rect fill="#2E6B4F" height="16" width="16" x="567" y="172"></rect>
<rect fill="#2E6B4F" height="16" width="16" x="727" y="172"></rect><rect fill="#FBFCFB" height="16" width="16" x="887" y="172"></rect>
<rect fill="#2E6B4F" height="16" width="16" x="87" y="212"></rect><rect fill="#FBFCFB" height="16" width="16" x="247" y="212"></rect>
<rect fill="#FBFCFB" height="16" width="16" x="407" y="212"></rect><rect fill="#2E6B4F" height="16" width="16" x="567" y="212"></rect>
<rect fill="#2E6B4F" height="16" width="16" x="727" y="212"></rect><rect fill="#FBFCFB" height="16" width="16" x="887" y="212"></rect>
<rect fill="#2E6B4F" height="16" width="16" x="87" y="252"></rect><rect fill="#FBFCFB" height="16" width="16" x="247" y="252"></rect>
<rect fill="#FBFCFB" height="16" width="16" x="407" y="252"></rect><rect fill="#2E6B4F" height="16" width="16" x="567" y="252"></rect>
<rect fill="#2E6B4F" height="16" width="16" x="727" y="252"></rect><rect fill="#FBFCFB" height="16" width="16" x="887" y="252"></rect>
</g>
<g fill="none" stroke="#C21F2C" stroke-width="2">
<circle cx="415" cy="180" r="13"></circle><circle cx="95" cy="220" r="13"></circle><circle cx="735" cy="260" r="13"></circle>
</g>
<text fill="#4A5560" font-size="10" x="20" y="296">filled = acceptable · hollow = not acceptable · ringed = preferred</text>
<text fill="#4A5560" font-size="10" x="20" y="310">preferred per class: interactive → stale over waiting · batch → late over lossy, a partial file corrupts downstream · money → absent over wrong</text>
<text fill="#4A5560" font-size="10.5" x="20" y="330">“Partial” is fine for a feed and poison for a ledger export. Ask each class, write the answers down, and the ladder builds itself.</text>
</svg>
