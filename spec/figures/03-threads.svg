<text fill="#2E6B4F" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11.5" font-weight="700" x="20" y="424">01 · OUTSIDE RECORDS IT<tspan fill="#4A5560" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="400">  — capability · hosting posture · contracts held · cost envelope · team topology · expected lifecycle</tspan></text>
<g fill="#4A5560" font-size="10">
<text x="20" y="444"><tspan fill="#101820" font-weight="600">02</tspan> cost ceiling enters the demand figures<tspan fill="#C9D2D4">    ·    </tspan><tspan fill="#101820" font-weight="600">04</tspan> store family, and where the boundaries are cut<tspan fill="#C9D2D4">    ·    </tspan><tspan fill="#101820" font-weight="600">05</tspan> tenancy model and residency posture</text>
<text x="20" y="460"><tspan fill="#101820" font-weight="600">08</tspan> placement executes the hosting posture<tspan fill="#C9D2D4">    ·    </tspan><tspan fill="#101820" font-weight="600">09</tspan> spend vs envelope · delivery sized by lifecycle · ownership</text>
</g>
<text fill="#2E6B4F" font-size="10" text-anchor="middle" x="500" y="482">A capability you already own changes which store is cheapest — and therefore which store is correct.</text>
<line stroke="#C9D2D4" stroke-width="1" x1="20" x2="980" y1="502" y2="502"></line>
