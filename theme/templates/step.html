{{head}}<body>
<div class="wrap">

<header class="doc">
  <div>
    <div class="doccode">THE OUTSIDE-IN METHOD · {{stamp}}</div>
    <h1>{{number}} · {{title}}</h1>
  </div>
  <p class="subtitle">One of the ten steps of the specification, on a page of its own. The specification governs; this page is a view of it.</p>
</header>

<nav class="toc" aria-label="Contents">{{nav}}</nav>

<section class="mod" id="step">
  <div class="tab">STEP {{number}}</div>
  <div class="body">
<div class="phase"><span class="lbl">{{phase_label}}</span><span class="rule"></span><span class="hint">{{phase_hint}}</span></div>
{{step}}  </div>
</section>

<p style="margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--ink2);line-height:1.9">{{licence_line}}</p>

</div>
</body>
</html>
