<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif" font-size="11">
  <defs><marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#101820"/></marker></defs>
  <text x="20" y="22" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="12.5" fill="#1B4F8A">THE CONSISTENCY MENU: A LADDER WITH A FORK, AND A SECOND AXIS</text>

  <text x="20" y="98" font-size="10" fill="#4A5560">order &#8212; each one implies the next</text>

  <g stroke="#101820" stroke-width="2">
    <rect x="20" y="108" width="190" height="48" fill="#1B4F8A"/>
    <rect x="250" y="108" width="190" height="48" fill="#DCE6F0"/>
    <rect x="480" y="108" width="150" height="48" fill="#DCE6F0"/>
  </g>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="13.5" text-anchor="middle">
    <text x="115" y="129" fill="#FBFCFB">LINEARIZABLE</text>
    <text x="345" y="129" fill="#101820">SEQUENTIAL</text>
    <text x="555" y="129" fill="#101820">CAUSAL</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="115" y="146" fill="#DCE6F0">the latest write, always</text>
    <text x="345" y="146" fill="#4A5560">one agreed order, maybe old</text>
    <text x="555" y="146" fill="#4A5560">causes before effects</text>
  </g>

  <g stroke="#101820" stroke-width="2" fill="none" marker-end="url(#arF)">
    <line x1="210" y1="132" x2="248" y2="132"/>
    <line x1="440" y1="132" x2="478" y2="132"/>
    <path d="M115,156 L115,222 L688,222"/>
  </g>
  <g stroke="#4A5560" stroke-width="1.5" fill="none" marker-end="url(#arF)">
    <path d="M630,122 C662,122 658,58 688,58"/>
    <path d="M630,127 C662,127 658,94 688,94"/>
    <path d="M630,132 C660,132 660,130 688,130"/>
    <path d="M630,137 C662,137 658,166 688,166"/>
  </g>

  <g fill="#DCE6F0" stroke="#1B4F8A" stroke-width="1.5">
    <rect x="690" y="44" width="290" height="28"/>
    <rect x="690" y="80" width="290" height="28"/>
    <rect x="690" y="116" width="290" height="28"/>
    <rect x="690" y="152" width="290" height="28"/>
  </g>
  <rect x="690" y="208" width="290" height="28" fill="#FBFCFB" stroke="#101820" stroke-width="2"/>
  <g font-size="11.5" font-weight="600" fill="#101820">
    <text x="704" y="62">read-your-writes</text>
    <text x="704" y="98">monotonic reads</text>
    <text x="704" y="134">monotonic writes</text>
    <text x="704" y="170">writes-follow-reads</text>
    <text x="704" y="226">eventual + a bound</text>
  </g>
  <g font-size="10" fill="#4A5560" text-anchor="end">
    <text x="966" y="62">sees its own effects</text>
    <text x="966" y="98">never goes backwards</text>
    <text x="966" y="134">its writes in order</text>
    <text x="966" y="170">after what it read</text>
    <text x="966" y="226" fill="#C21F2C">limits age, not order</text>
  </g>
  <text x="130" y="215" font-size="10" fill="#4A5560">age &#8212; only linearizable is above it; causal and sequential reads may be any age</text>
  <text x="704" y="196" font-size="10" fill="#2E6B4F" font-weight="600">session guarantees &#183; no arrow between them</text>

  <line x1="20" y1="252" x2="980" y2="252" stroke="#C9D2D4"/>
  <text x="20" y="272" font-size="10.5" fill="#4A5560">An arrow points from a stronger guarantee to a weaker one. Two boxes with no path between them are two promises:</text>
  <text x="20" y="288" font-size="10.5" fill="#4A5560">need both, and you buy both mechanisms <tspan fill="#101820" font-weight="600">&#8212; or the one box above them, whichever is cheaper.</tspan></text>
</svg>
