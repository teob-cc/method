<svg viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace" font-size="10.5">
  <text x="20" y="20" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="12.5" fill="#1B4F8A">THE SAME MILLION REQUESTS, SORTED BY HOW LONG THEY TOOK</text>

  <rect x="860" y="32" width="85" height="183" fill="#F7E6E7"/>
  <text x="902" y="46" text-anchor="middle" fill="#C21F2C" font-weight="600" font-size="10">the last 10%</text>

  <line x1="140" y1="215" x2="945" y2="215" stroke="#101820" stroke-width="1.5"/>
  <line x1="140" y1="30" x2="140" y2="215" stroke="#101820" stroke-width="1.5"/>

  <path d="M140,193 C300,191 450,189 540,187 C680,183 790,177 860,166 C900,152 918,122 932,92 C938,72 941,52 943,38"
        fill="none" stroke="#1B4F8A" stroke-width="2.5"/>

  <g stroke="#4A5560" stroke-width="1" stroke-dasharray="4 3">
    <line x1="140" y1="187" x2="540" y2="187"/>
    <line x1="540" y1="187" x2="540" y2="215"/>
    <line x1="140" y1="92"  x2="932" y2="92"/>
    <line x1="932" y1="92"  x2="932" y2="215"/>
  </g>
  <circle cx="540" cy="187" r="3.5" fill="#101820"/>
  <circle cx="932" cy="92" r="3.5" fill="#C21F2C"/>

  <g text-anchor="end" font-weight="600">
    <text x="132" y="191" fill="#101820">p50 · 40 ms</text>
    <text x="132" y="96" fill="#C21F2C">p99 · 210 ms</text>
  </g>

  <g text-anchor="middle" fill="#4A5560" font-size="10">
    <text x="140" y="232">0%</text>
    <text x="540" y="232">50%</text>
    <text x="860" y="232">90%</text>
    <text x="932" y="248">99%</text>
  </g>
  <text x="542" y="262" text-anchor="middle" fill="#4A5560" font-size="10">requests, sorted by latency</text>
  <text x="128" y="42" text-anchor="end" fill="#4A5560" font-size="10">slower</text>

  <text x="652" y="120" text-anchor="middle" fill="#8C5410" font-weight="600" font-size="10">mean · 52 ms</text>
  <text x="652" y="132" text-anchor="middle" fill="#8C5410" font-size="9.5">— experienced by almost nobody</text>
  <line x1="652" y1="138" x2="652" y2="182" stroke="#8C5410" stroke-width="1.5"/>
  <circle cx="652" cy="183" r="3" fill="#8C5410"/>

  <text x="20" y="282" fill="#4A5560" font-size="10.5">Same data, three summaries. The mean is 52 ms, the median is 40 ms, and one request in a hundred takes four times the mean.</text>
</svg>
